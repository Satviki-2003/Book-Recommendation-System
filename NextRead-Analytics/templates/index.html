<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>NextRead Analytics</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="static/styling/style.css">
    <body>
      <!-- Loader -->
      <div id="loading-screen" class="d-none">
          <div class="loading-box">
              <div class="spinner-border text-info" role="status" style="width: 3rem; height: 3rem;"></div>
              <h3 class="mt-3">Generating Recommendations...</h3>
          </div>
      </div>
      
      <section id='home-div'>
        <h1 id='home-title'>
          <span>
            NextRead Analytics
          </span>
        </h1>
        <form class="d-flex" role="search">
          <input id='user-id' class="form-control me-2" type="search" placeholder="Try 254..." aria-label="Search" required/>
          <button id='search-btn' class="btn" type="submit">Recommend</button>
        </form>
      </section>
      
  </body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const btn=document.getElementById('search-btn')
      const input=document.getElementById('user-id')
      
      btn.addEventListener('click',(e)=>
        {
          e.preventDefault()
          
          const userId = input.value.trim();
          const num = Number(userId);

          // Check if it's a valid integer (and make sure the original string wasn't empty)
          if (userId !== "" && Number.isInteger(num) && num>0 && num<10000) {
              window.location.href = `/recommendations/${userId}`;
          } else {
              alert('Please enter a valid userId.');
          }
        });

      // Detect when the user navigates back to this page via the back button
      window.addEventListener('pageshow', (event) => {
        // event.persisted is true if the page was loaded from the browser cache
        if (event.persisted) {
          const loader = document.getElementById('loading-screen');

          // Hide the loader again so the home page looks normal
          if (!loader.classList.contains('d-none')) {
            loader.classList.add('d-none');
          }
        }
      });
    </script>
</html>
